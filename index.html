<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dajana helados / login</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="encabezado-login">
        <div class="logo-nombre"><img src="img/dajana-logo.png" alt="logo dajana"></div>
        <div class="logo-subtitulo">h e l a d o s</div>
    </div>

    <div class="cuerpo-login">
        <div class="titulo-login">LOGIN</div>
        <div class="formulario-login">
            <div class="columna-apilada-7">
                <div class="etiqueta-personalizada">USUARIO</div>
                <input class="entrada-personalizada" id="inp-u" type="text" placeholder="INGRESE NOMBRE DE USUARIO">
            </div>
            <div class="columna-apilada-7">
                <div class="etiqueta-personalizada">CONTRASEÑA</div>
                <input class="entrada-personalizada" id="inp-p" type="password" placeholder="INGRESE CONTRASE�A">
            </div>
            <div class="error" id="error-login">Usuario o contraseña incorrectos</div>
            
        </div>
        <div class="centrado margen-superior-6">
                <button class="boton-iniciar-sesion" onclick="login()">INICIAR SESIÓN</button>
            </div>
        <div class="pistas-login">
             admin / admin &nbsp;|&nbsp;  juan / juan    &nbsp;|&nbsp;  ana / ana
        </div>
    </div>
    </div>
    <!-- login -->
    <script> 
        const USUARIOS = [
            { user: 'admin', pass: 'admin', rol: 'admin', nombre: 'Administrador' },
            { user: 'juan', pass: 'juan', rol: 'empleado', nombre: 'Juan' },
            { user: 'ana', pass: 'ana', rol: 'empleado', nombre: 'Ana' },
        ];
    // esto es para llamar a la funcion login
        document.getElementById('inp-p').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    // esta es la funcion login que se llama al hacer click en el boton iniciar sesion o al presionar enter en el campo de contraseña
        function login() {
            const u = document.getElementById('inp-u').value.trim().toLowerCase(); // se obtiene el valor del campo de usuario, se elimina los espacios en blanco y se convierte a minusculas para evitar problemas de mayusculas o espacios al inicio o al final
            const p = document.getElementById('inp-p').value.trim(); // se obtiene el valor del campo de contraseña, se elimina los espacios en blanco para evitar problemas de espacios al inicio o al final
            const err = document.getElementById('error-login'); // se obtiene el elemento del mensaje de error para mostrarlo u ocultarlo segun corresponda
    // esta es la validacion de los usuarios, se busca en el array de usuarios si existe un usuario con el mismo nombre y contraseña
            const usr = USUARIOS.find(x => x.user === u && x.pass === p);
    // si no se encuentra el usuario, se muestra el mensaje de error, si se encuentra, se guarda el usuario en el sessionStorage y se redirige a la pagina correspondiente segun el rol del usuario
            if (!usr) {
                err.style.display = 'block'; // mostrar mensaje de error
                return;
            }
    // si el usuario es correcto, se oculta el mensaje de error, se guarda el usuario en el sessionStorage y se redirige a la pagina correspondiente segun el rol del usuario
            err.style.display = 'none'; // ocultar mensaje de error
            sessionStorage.setItem('dajana_user', JSON.stringify(usr)); // guardar usuario en sessionStorage
            window.location.href = usr.rol === 'admin' ? 'admin.html' : 'empleado.html'; // redirigir a la pagina correspondiente segun el rol del usuario
        }
    </script>
</body>

</html>
