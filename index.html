<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dajana helados / login</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="lg-hd">
        <div class="lg-n"><img src="img/dajana-logo.png" alt="logo dajana"></div>
        <div class="lg-s">h e l a d o s</div>
    </div>

    <div class="lg-body">
        <div class="lg-tit">LOGIN</div>
        <div class="lg-form">
            <div class="col-stack-7">
                <div class="c-lbl">USUARIO</div>
                <input class="c-inp" id="inp-u" type="text" placeholder="INGRESE NOMBRE DE USUARIO">
            </div>
            <div class="col-stack-7">
                <div class="c-lbl">CONTRASEÑA</div>
                <input class="c-inp" id="inp-p" type="password" placeholder="INGRESE CONTRASEÑA">
            </div>
            <div class="err" id="lg-err">Usuario o contraseña incorrectos</div>
            <a href="admin.html" class="btn-login" style="text-decoration:none; display:inline-block;">INICIAR SESIÓN
                (ADMIN)</a>
            <a href="empleado.html" class="btn-login"
                style="text-decoration:none; display:inline-block; background: var(--salmon);">INICIAR SESIÓN (EMP)</a>
        </div>
        <!-- <div class="center mt-6">
                <button class="btn-login" onclick="login()">INICIAR SESIÓN</button>
            </div> -->
        <div class="login-hints">
            👤 admin / admin &nbsp;|&nbsp; 👤 empleado / empleado &nbsp;|&nbsp; 👤 ana / ana
        </div>
    </div>
    </div>

    <script>
        const USUARIOS = [
            { user: 'admin', pass: 'admin', rol: 'admin', nombre: 'Administrador' },
            { user: 'empleado', pass: 'empleado', rol: 'empleado', nombre: 'Juan' },
            { user: 'ana', pass: 'ana', rol: 'empleado', nombre: 'Ana' },
        ];

        document.getElementById('inp-p').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });

        function login() {
            const u = document.getElementById('inp-u').value.trim().toLowerCase();
            const p = document.getElementById('inp-p').value.trim();
            const err = document.getElementById('lg-err');

            const usr = USUARIOS.find(x => x.user === u && x.pass === p);

            if (!usr) {
                err.style.display = 'block';
                return;
            }

            err.style.display = 'none';
            sessionStorage.setItem('dajana_user', JSON.stringify(usr));
            window.location.href = usr.rol === 'admin' ? 'admin.html' : 'empleado.html';
        }
    </script>
</body>

</html>
