<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dajana helados / login</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="encabezado-login">
        <div class="logo-nombre"><img src="img/dajana-logo.png" alt="logo dajana"></div>
        <div class="logo-subtitulo">h e l a d o s</div>
    </div>

    <div class="cuerpo-login">
        <div class="titulo-login">LOGIN</div>
        <div class="formulario-login">
            <div class="columna-apilada-7">
                <div class="etiqueta-personalizada">USUARIO</div>
                <input class="entrada-personalizada" id="inp-u" type="text" placeholder="INGRESE NOMBRE DE USUARIO">
            </div>
            <div class="columna-apilada-7">
                <div class="etiqueta-personalizada">CONTRASEÑA</div>
                <input class="entrada-personalizada" id="inp-p" type="password" placeholder="INGRESE CONTRASEÑA">
            </div>
            <div class="error" id="error-login">Usuario o contraseña incorrectos</div>
            
        </div>
        <div class="centrado margen-superior-6">
                <button class="boton-iniciar-sesion" onclick="login()">INICIAR SESIÓN</button>
            </div>
        <div class="pistas-login">
            👤 admin / admin &nbsp;|&nbsp; 👤 empleado / empleado &nbsp;|&nbsp; 👤 ana / ana
        </div>
    </div>
    </div>

    <script>
        const USUARIOS = [
            { user: 'admin', pass: 'admin', rol: 'admin', nombre: 'Administrador' },
            { user: 'empleado', pass: 'empleado', rol: 'empleado', nombre: 'Juan' },
            { user: 'ana', pass: 'ana', rol: 'empleado', nombre: 'Ana' },
        ];

        document.getElementById('inp-p').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });

        function login() {
            const u = document.getElementById('inp-u').value.trim().toLowerCase();
            const p = document.getElementById('inp-p').value.trim();
            const err = document.getElementById('error-login');

            const usr = USUARIOS.find(x => x.user === u && x.pass === p);

            if (!usr) {
                err.style.display = 'block';
                return;
            }

            err.style.display = 'none';
            sessionStorage.setItem('dajana_user', JSON.stringify(usr));
            window.location.href = usr.rol === 'admin' ? 'admin.html' : 'empleado.html';
        }
    </script>
</body>

</html>
